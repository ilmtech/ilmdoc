<h1>Uninstall the module</h1>
<ol class="steps"><li>Go to Modules &gt; Module Manager.</li><li>Find ILM Chat &amp; Order for WhatsApp in the list.</li><li>Click Uninstall.</li></ol>
<p>After uninstalling, the chat button and the WhatsApp buttons no longer show on your shop. Uninstalling also removes the settings and the click statistics.</p>
