<h3>Step 1</h3>
<p>Copy the <strong>YouTube video URL</strong> from your browser's address bar</p>
<img class="shot" src="/images/shopify/sizechart/Manage-Size-Charts/How-to-add-a-video/1.jpg" alt="">
<h3>or</h3>
<p>Copy the <strong>Vimeo video URL</strong> from your browser's address bar</p>
<img class="shot" src="/images/shopify/sizechart/Manage-Size-Charts/How-to-add-a-video/2.jpg" alt="">
<h3>Step 2</h3>
<p>Return to your store and open your Size Chart.</p>
<h3>Step 3</h3>
<p>Go to <strong>Chart Blocks &gt; Video Block</strong>, paste the copied <strong>Video URL</strong>, and save your size chart.</p>
<img class="shot" src="/images/shopify/sizechart/Manage-Size-Charts/How-to-add-a-video/3.jpg" alt="">
