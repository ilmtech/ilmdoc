<h1>Uninstall the module</h1>

<h3 class="sub">6.1 Remove the module</h3>
<ol class="steps">
<li>In your PrestaShop back office, go to Modules and open the Module Manager.</li>
<li>Find All In One Captcha - Anti Spam Email &amp; Message and click Uninstall.</li>
<li>Confirm when asked.</li>
</ol>

<p>Uninstalling removes the module settings and its saved logs.</p>
